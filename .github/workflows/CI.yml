name: CI

on:
  workflow_call: # From .github/workflows/Release.yml
  workflow_dispatch:
  merge_group:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  all-jobs:
    if: always() # Otherwise this job is skipped if the matrix job fails
    name: all-jobs
    runs-on: ubuntu-latest
    needs:
      - lint
      - build-and-test-binaries
    steps:
      - run: jq --exit-status 'all(.result == "success")' <<< '${{ toJson(needs) }}'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: cargo install cargo-deny --locked
      - run: bash scripts/lint.sh

  build-and-test-binaries:
    name: build and test binary (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: git-branch-deleter
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: git-branch-deleter.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: git-branch-deleter
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - run: cargo test --locked
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: git-branch-deleter-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error
